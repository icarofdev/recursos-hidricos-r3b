# ==============================================================================
# Nginx Configuration — Recursos Hídricos R3B (SM-WU Production)
# Copie para /etc/nginx/sites-available/recursos-hidricos
# e crie link em /etc/nginx/sites-enabled/
# ==============================================================================

# Rate limit para o endpoint de ingestão IoT (previne abusos e brute-force)
limit_req_zone $binary_remote_addr zone=smwu_ingest:10m rate=5r/s;

# ------------------------------------------------------------------------------
# 1. Servidor HTTP (Porta 80)
# O SM-WU V5.10 não suporta TLS/HTTPS. Portanto:
# - Aceita HTTP SOMENTE no endpoint de ingestão do medidor.
# - Todo o restante (dashboard, consultas, APIs) é redirecionado para HTTPS.
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com.br; # Substitua pelo seu domínio ou IP da VPS

    # --------------------------------------------------------------------------
    # ATENÇÃO COM O CERTBOT:
    # NUNCA execute certbot com redirecionamento automático.
    # Use: certbot certonly --webroot -w /var/www/html -d seudominio.com.br
    # (ou certbot --nginx --no-redirect) para NUNCA alterar este bloco.
    # --------------------------------------------------------------------------

    # Desafio Let's Encrypt / Certbot para emissão e renovação automática de SSL
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # ÚNICO endpoint liberado em HTTP puro (para firmware SM-WU V5.10 sem TLS)
    location = /api/device/ingest.php {
        limit_req zone=smwu_ingest burst=10 nodelay;
        client_max_body_size 8k;
        client_body_timeout 10s;

        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 15s;
        fastcgi_param HTTP_PROXY "";
    }

    # Bloqueia qualquer outro endpoint em HTTP e redireciona permanentemente para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Servidor HTTPS (Porta 443)
# Dashboard, Painel, Consultas e APIs 100% protegidos com TLS
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seudominio.com.br; # Substitua pelo seu domínio

    root /var/www/recursos-hidricos-r3b;
    index index.php;

    # Certificados SSL (gerados pelo Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Headers de Segurança
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Bloqueia arquivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloqueia diretórios sensíveis do backend
    location ~ ^/(config|database|deploy|tests|scripts|vendor|\.runtime)/ {
        deny all;
        return 404;
    }

    # Healthcheck para monitoramento
    location = /health.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        access_log off;
    }

    # Ingestão HTTPS (suportada por firmwares com TLS ou proxies autorizados)
    location = /api/device/ingest.php {
        limit_req zone=smwu_ingest burst=10 nodelay;
        client_max_body_size 8k;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    # Endpoints de consulta da API
    location ~ ^/api/device/(current|history|status|alerts)\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 15s;
    }

    # Arquivos estáticos (CSS, JS, imagens) com cache do navegador
    location /static/ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Dashboard principal
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Processamento PHP geral
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param HTTP_PROXY "";
    }
}
