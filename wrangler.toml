name = "hidra-r3b"
main = "dist/worker/index.js"
compatibility_date = "2026-03-01"

[vars]
APP_ENV = "production"
MONITORIE_MODE = "live"
MAIL_MODE = "disabled"
MONITORIE_CACHE_SECONDS = "300"
DEVICE_OFFLINE_AFTER_SECONDS = "90"
INGEST_ENABLED = "false"
CORS_ORIGINS = "https://hidra-r3b.vercel.app"
MONITORIE_SMWU_MAPPING = '{"distancia":{"key":"d","unit":"cm"},"nivel":{"key":"nivel","unit":"%"},"volume":{"key":"volume","unit":"L"},"rssi_wifi":{"key":"rssi_wifi","unit":"dBm"}}'
MONITORIE_SMWA_MAPPING = '{"vazao":{"key":"vazao","unit":"L/h"},"consumo_acumulado":{"key":"consumo","unit":"L"},"rssi_wifi":{"key":"rssi_wifi","unit":"dBm"}}'
READINGS_RETENTION_DAYS = "90"
AUDIT_RETENTION_DAYS = "180"
RETENTION_BATCH_SIZE = "500"


[[d1_databases]]
binding = "DB"
database_name = "hidra-r3b"
database_id = "0148ef8b-e4c4-44d1-b188-0dcd159a23db"
migrations_dir = "cloudflare/migrations"

[env.preview]
name = "hidra-r3b-preview"

[env.preview.vars]
APP_ENV = "preview"
MONITORIE_MODE = "unconfigured"
MAIL_MODE = "disabled"
MONITORIE_CACHE_SECONDS = "60"
DEVICE_OFFLINE_AFTER_SECONDS = "90"
INGEST_ENABLED = "false"
CORS_ORIGINS = ""
APP_URL = ""
READINGS_RETENTION_DAYS = "90"
AUDIT_RETENTION_DAYS = "180"
RETENTION_BATCH_SIZE = "500"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "hidra-r3b-preview"
database_id = "c794e2f5-15ca-4764-af44-58b17b9e225f"
migrations_dir = "cloudflare/migrations"


[triggers]
crons = ["*/10 * * * *"]

[observability.logs]
enabled = true
invocation_logs = false
